  <head><title>递归练习反馈</title></head>
  <body>
    <h1>递归练习反馈：林晓雨</h1>
    <p>助教观察：学生能口头解释递归，但独立写代码时经常先写 recursive call，最后才想停止条件。</p>
    <p>重复错误标签：缺少 base case、停止条件太晚、maximum recursion depth exceeded、空节点没有处理。</p>
    <p>建议下一步：先拿一个很小的输入，写出“什么时候停止”和“停止时返回什么”，再写递归调用。</p>
  </body>
</html>
